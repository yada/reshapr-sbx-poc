# syntax=docker/sandbox-kit:3
# POC kit: connect a Docker Sandboxes agent to ONE reShapr exposition.
# Usage and design notes: see ../README.md
#
# MIGRATION NOTE: migrated from schemaVersion "2" (tag v0.1.0-v2). The grammar
# changed (typed capabilities), the behaviour did not.
schemaVersion: "3"
kind: mixin
version: "0.2.0"
sourceUrl: https://github.com/yada/reshapr-sbx-poc
displayName: reShapr (local server)
description: Registers a reShapr MCP exposition running on the host with the agent. The exposition API key stays on the host; the sandbox proxy injects it.
licenses:
  - Apache-2.0

# MIGRATION NOTE: `env:` exports each arg to the container at create, so scripts
# on the host side (scripts/mcp-smoke.sh) can rebuild the MCP URL. v2 set a
# RESHAPR_MCP_URL environment variable, which a mixin can no longer do without
# an image recipe.
args:
  port:
    default: "7777"
    description: Host port of the reShapr server.
    pattern: '^[0-9]{2,5}$'
    env: RESHAPR_PORT
  exposition:
    default: "reshapr/open-meteo-weather-forecast-api-1-0-default"
    description: "<organization>/<exposition-name> path of the exposition (see `reshapr expo list`)."
    pattern: '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'
    env: RESHAPR_EXPOSITION

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # Same rule in both phases: the install hooks only write config files, but
      # the credential below is shared across both phases and every inject
      # domain must be allowed in each of them.
      install:
        allow:
          - "localhost:${{ kit.args.port }}"
      runtime:
        allow:
          - "localhost:${{ kit.args.port }}"

  # MIGRATION NOTE: v2 `required: false` became `optional: true` (v3 credentials
  # are required unless they opt out). Omit the secret for a public exposition.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: API key of the reShapr Configuration Plan. Store it with `sbx secret set reshapr`.
    config:
      service: reshapr
      phase: [install, runtime]
      apiKey:
        name: RESHAPR_API_KEY
        proxyManaged: true
        inject:
          # Inside the sandbox, "localhost" is the sandbox itself, so clients reach
          # the host's reShapr server as host.docker.internal. The sbx proxy then
          # rewrites that name to localhost and matches both the allow-list and
          # the inject rule on the rewritten name, hence "localhost" below.
          - domain: localhost
            header: x-reshapr-key
            format: "%s"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # MIGRATION NOTE: hook environments are deny-by-default in v3, so each
        # hook that reads RESHAPR_API_KEY declares it in `env:`.
        #
        # `claude mcp add` is not idempotent (exit 1 when the entry exists), hence `|| true`.
        - command: |
            command -v claude >/dev/null 2>&1 || exit 0
            claude mcp add reshapr "http://host.docker.internal:${{ kit.args.port }}/mcp/${{ kit.args.exposition }}" \
              --transport http --scope user \
              --header "x-reshapr-key: $RESHAPR_API_KEY" || true
          user: "agent"
          env: [RESHAPR_API_KEY]
          description: Register the reShapr exposition with Claude Code
        # Append rather than rewrite: config.toml is shared with Codex itself.
        # The key is `http_headers` (not `headers`); Codex silently ignores unknown keys.
        - command: |
            command -v codex >/dev/null 2>&1 || exit 0
            mkdir -p "$HOME/.codex"
            cfg="$HOME/.codex/config.toml"
            touch "$cfg"
            grep -q '^\[mcp_servers.reshapr\]' "$cfg" && exit 0
            cat >> "$cfg" <<EOF

            [mcp_servers.reshapr]
            url = "http://host.docker.internal:${{ kit.args.port }}/mcp/${{ kit.args.exposition }}"
            [mcp_servers.reshapr.http_headers]
            x-reshapr-key = "$RESHAPR_API_KEY"
            EOF
          user: "agent"
          env: [RESHAPR_API_KEY]
          description: Register the reShapr exposition with Codex
        # Merge (never overwrite) into Copilot's MCP config, which the copilot kit and
        # `copilot mcp add` also write. Re-running replaces only the `reshapr` entry.
        - command: |
            command -v copilot >/dev/null 2>&1 || exit 0
            command -v jq >/dev/null 2>&1 || { echo "jq missing: reshapr not registered with Copilot" >&2; exit 0; }
            dir="$HOME/.copilot"; cfg="$dir/mcp-config.json"
            mkdir -p "$dir"
            [ -s "$cfg" ] || echo '{}' > "$cfg"
            tmp="$(mktemp "$dir/mcp-config.json.XXXXXX")"
            jq --arg url "http://host.docker.internal:${{ kit.args.port }}/mcp/${{ kit.args.exposition }}" \
               --arg key "$RESHAPR_API_KEY" \
               '.mcpServers = ((.mcpServers // {}) + {reshapr: {type: "http", url: $url, headers: {"x-reshapr-key": $key}, tools: ["*"]}})' \
               "$cfg" > "$tmp" && chmod 600 "$tmp" && mv -f "$tmp" "$cfg" || rm -f "$tmp"
          user: "agent"
          env: [RESHAPR_API_KEY]
          description: Register the reShapr exposition with Copilot CLI

  # Inline `content:` rather than `contentFile:` keeps the kit a single file
  # with no recipe.
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## reShapr MCP tools

        An MCP server named `reshapr` is registered. It gives governed access to
        backend APIs: call its tools instead of reaching the APIs directly (direct
        egress to them is blocked). `RESHAPR_API_KEY` holds a placeholder, not the
        real key; the sandbox proxy adds the real one. Responses are already
        trimmed by reShapr, so prefer the tool output over re-fetching.
